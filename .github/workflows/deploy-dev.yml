name: Deploy Dev UI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role, no stored access keys

concurrency:
  group: deploy-dev-ui
  cancel-in-progress: true

env:
  AWS_REGION: ca-central-1
  # The UI bucket and CloudFront distribution are created by the API repo's serverless stack.
  API_STACK: project-hub-api-dev

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Empty base URL: the UI calls /api on its own CloudFront origin (required for the SameSite=Strict cookies).
          VITE_API_BASE_URL: ""
          VITE_AUTH_MODE: cognito
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read hosting targets from the API stack
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$API_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "UI_BUCKET=$(output UiBucketName)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(output CloudFrontDistributionId)" >> "$GITHUB_ENV"
          echo "APP_URL=$(output AppUrl)" >> "$GITHUB_ENV"

      # Hashed assets are immutable; index.html must always be revalidated so new releases show up.
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://$UI_BUCKET/" --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://$UI_BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/" > /dev/null
          echo "Deployed to $APP_URL"
